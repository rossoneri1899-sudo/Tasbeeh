# Temporary: transcribe candidate Hisn al-Muslim recordings to check what each file says. Removed before merging.
name: transcribe-audio
on:
  push:
    branches: [claude/eager-dijkstra-efambd]
    paths: [.github/workflows/transcribe-audio.yml, 'audio/**']
  workflow_dispatch:
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -q openai-whisper
      - uses: actions/checkout@v4
      - name: Transcribe trimmed recordings
        run: |
          python - <<'PY'
          import whisper, glob
          m = whisper.load_model("medium")
          for f in sorted(glob.glob("audio/*.mp3")):
              r = m.transcribe(f, language="ar", word_timestamps=True, temperature=0)
              print(f"=== {f}  TEXT: {r['text'].strip()}")
          PY
