<!DOCTYPE html>
<meta charset="utf-8">
<title>Voice engine tests</title>
<!-- Synthetic-audio checks for beta/voice.js. Serve the repo root (python -m http.server) and open /tools/voice-test.html. -->
<style>body{font:15px/1.5 system-ui;margin:24px}td{padding:2px 12px 2px 0}.f{color:#a00;font-weight:600}.p{color:#060}</style>
<h1>Voice engine tests</h1>
<table id="out"><tr><td>Running…</td></tr></table>
<script src="../beta/voice.js"></script>
<script>
const V = Voice, SR = 16000;
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
// a vowel: harmonics of f0 shaped by two formants, with a little pitch drift
function vowel(ms, f0, F1, F2, amp, jit) {
  const n = Math.round(ms * SR / 1000), x = new Float32Array(n); let ph = 0;
  const f = f0 * (1 + (jit || 0) * (rnd() - 0.5));
  for (let i = 0; i < n; i++) {
    const env = Math.min(1, i / 400, (n - i) / 400); ph += 2 * Math.PI * f * (1 + 0.03 * Math.sin(i / 900)) / SR; let s = 0;
    for (let h = 1; h * f < 3800; h++) { const fh = h * f, g = Math.exp(-((fh - F1) ** 2) / (2 * 120 ** 2)) + 0.7 * Math.exp(-((fh - F2) ** 2) / (2 * 180 ** 2)) + 0.02; s += g * Math.sin(h * ph) / h ** 0.3; }
    x[i] = amp * env * s * 0.15;
  }
  return x;
}
const noise = (ms, amp) => Float32Array.from({ length: Math.round(ms * SR / 1000) }, () => (rnd() * 2 - 1) * amp);
const sil = ms => noise(ms, 0.0008);
const cat = parts => { const n = parts.reduce((a, p) => a + p.length, 0), o = new Float32Array(n); let k = 0; for (const p of parts) { o.set(p, k); k += p.length; } return o; };
const mix = (a, b) => Float32Array.from(a, (v, i) => v + (b[i % b.length] || 0));
// "phrase A" and "phrase B" have different vowel shapes, like SubhanAllah and Alhamdulillah
const A = (sp = 1, j = 0.06, amp = 1) => cat([vowel(150 * sp, 130, 320, 800, amp, j), noise(50 * sp, 0.05 * amp), vowel(160 * sp, 140, 700, 1200, amp, j), noise(40 * sp, 0.04 * amp), vowel(220 * sp, 125, 650, 1100, amp, j), vowel(260 * sp, 120, 600, 1000, 0.9 * amp, j)]);
const B = (sp = 1, j = 0.06) => cat([vowel(180 * sp, 135, 300, 2300, 1, j), vowel(200 * sp, 130, 500, 1800, 1, j), noise(40 * sp, 0.04), vowel(160 * sp, 140, 350, 2000, 1, j), vowel(240 * sp, 125, 450, 1700, 0.9, j)]);
const rep = (f, n, pause) => cat([sil(500)].concat(...Array.from({ length: n }, () => [f(), sil(pause)])).concat([sil(1200)]));

function segs(audio) { const s = new V.Segmenter({ sens: 17, gap: 350 }); let n = 0; for (const fr of V.frames(audio)) { const r = s.push(fr); if (r && !r.rejected && r.dur >= 280 && r.voicedMs >= r.dur * 0.25) n++; } return n; }
// templates are made the way the app makes them: a recording with a little silence around it
const tpl = [A(), A(1.1), A(0.92), A(1.05), A()].map(x => V.template(cat([sil(80), x, sil(80)])));
const negs = [B(), B(1.1)].map(x => V.template(cat([sil(80), x, sil(80)])));
const cal = V.calibrate(tpl, negs);
function matches(audio, mul = 1.05, sens = 12) { const s = new V.Segmenter({ sens, gap: 350 }), m = new V.Matcher(tpl, cal.thr * mul); let n = 0; for (const fr of V.frames(audio)) { s.push(fr); if (m.push(fr, s.speech)) n++; } return n; }
const tv = cat(Array.from({ length: 12 }, (_, i) => cat([vowel(120 + rnd() * 200, 180 + rnd() * 60, 300 + rnd() * 500, 900 + rnd() * 1400, 0.6, 0.1), sil(40 + rnd() * 120)])));

const tests = [
  ['Segmenter: 5 recitations with pauses', () => segs(rep(A, 5, 450)), 5],
  ['Segmenter: slow recitation counts once each (no splitting)', () => segs(rep(() => A(2.6), 3, 500)), 3],
  ['Segmenter: hiss/noise bursts', () => segs(cat([sil(500), noise(400, 0.3), sil(600), noise(300, 0.3), sil(600), noise(500, 0.25), sil(1000)])), 0],
  ['Segmenter: clatter (clicks)', () => segs(cat([sil(500)].concat(...Array.from({ length: 8 }, () => [noise(15, 0.6), sil(180)])), [sil(1000)])), 0],
  ['Match: 10 recitations', () => matches(rep(A, 10, 450)), 10],
  ['Match: 33 recitations, varied speed', () => matches(cat([sil(500)].concat(...Array.from({ length: 33 }, () => [A(0.85 + rnd() * 0.35), sil(300 + rnd() * 300)])), [sil(1200)])), 33],
  ['Match: 5 back-to-back, no pauses', () => matches(cat([sil(500), A(), A(1.05), A(0.95), A(), A(1.02), sil(1500)])), 5],
  ['Match: slow (1.6x)', () => matches(rep(() => A(1.6), 3, 500)), 3],
  ['Match: quieter voice (-12 dB)', () => matches(rep(() => A(1, 0.06, 0.25), 5, 450)), 5],
  ['Match: with background hiss (about 30 dB below the voice)', () => matches(mix(rep(A, 5, 450), noise(3000, 0.005)), 1.05, 11), 5],
  ['Match: similar sounds (same vowels, other order)', () => matches(rep(() => cat([vowel(260, 120, 600, 1000, 0.9, 0.06), vowel(150, 130, 320, 800, 1, 0.06), vowel(220, 125, 650, 1100, 1, 0.06), vowel(160, 140, 700, 1200, 1, 0.06)]), 5, 450)), 0],
  ['Match: one syllable different', () => matches(rep(() => cat([vowel(150, 130, 320, 800, 1, 0.06), noise(50, 0.05), vowel(160, 140, 300, 2200, 1, 0.06), noise(40, 0.04), vowel(220, 125, 650, 1100, 1, 0.06), vowel(260, 120, 600, 1000, 0.9, 0.06)]), 5, 450)), 0],
  ['Match: highest sensitivity still rejects other speech', () => matches(cat([sil(500), tv, sil(400), tv, sil(1000)]), 1.25), 0],
  ['Match: a different dhikr', () => matches(rep(B, 10, 450)), 0],
  ['Match: other speech (random vowels, like a TV)', () => matches(cat([sil(500), tv, sil(400), tv, sil(1000)])), 0],
  ['Match: noise bursts', () => matches(cat([sil(500), noise(400, 0.3), sil(600), noise(300, 0.3), sil(1000)])), 0],
];
// voice profile: built from the user's recordings of two different adhkar; another speaker has a higher pitch
// and a shorter vocal tract (formants about 15% higher)
const other = (sp = 1) => cat([vowel(150 * sp, 215, 370, 920, 1, 0.06), noise(50 * sp, 0.05), vowel(160 * sp, 230, 800, 1380, 1, 0.06), vowel(220 * sp, 205, 750, 1270, 1, 0.06), vowel(260 * sp, 200, 690, 1150, 0.9, 0.06)]);
const userRecs = [A(), A(1.1), A(0.95), B(), B(1.05), B(0.9), A(1.02), B()].map(x => V.voiceStats(V.frames(cat([sil(80), x, sil(80)]))));
const prof = V.profile(userRecs);
const likeUser = x => V.soundsLikeUser(prof, V.frames(cat([sil(80), x, sil(80)])));
const third = () => cat([vowel(200, 125, 400, 1500, 1, 0.06), vowel(220, 130, 550, 1300, 1, 0.06), vowel(180, 120, 450, 1600, 1, 0.06)]);
// learning by itself: of 6 recitations picked up while counting, one was really a cough-like noise
const picked = [A(), A(1.08), noise(500, 0.2), A(0.94), A(1.03), A()].map(x => V.template(cat([sil(80), x, sil(80)])));
tests.push(
  ['Profile: your voice saying a learned dhikr', () => [A(), A(1.05), B(1.02)].filter(likeUser).length, 3],
  ['Profile: your voice saying a different dhikr', () => [third(), third()].filter(likeUser).length, 2],
  ['Profile: another speaker (higher voice)', () => [other(), other(1.1), other(0.9)].filter(x => likeUser(x) === true).length, 0],
  ['Profile: hiss and clatter can’t be judged (left to the other checks)', () => [noise(500, 0.2)].filter(x => likeUser(x) === true).length, 0],
  ['Learning: keeps the consistent recitations, drops the noise', () => { const k = V.consistent(picked); return k.length === 5 && !k.includes(2) ? 1 : 0; }, 1],
);
// whispers: breath noise through the same vowel shapes, no pitch
function whisperVowel(ms, F1, F2, amp) {
  const n = Math.round(ms * 16), x = new Float32Array(n); let a1 = 0, b1 = 0, a2 = 0, b2 = 0;
  const r = 0.97, c1 = 2 * r * Math.cos(2 * Math.PI * F1 / SR), c2 = 2 * r * Math.cos(2 * Math.PI * F2 / SR);
  for (let i = 0; i < n; i++) { const w = rnd() * 2 - 1, y1 = w + c1 * a1 - r * r * b1, y2 = w + c2 * a2 - r * r * b2; b1 = a1; a1 = y1; b2 = a2; a2 = y2; x[i] = amp * Math.min(1, i / 400, (n - i) / 400) * (y1 * 0.02 + y2 * 0.014); }
  return x;
}
const WA = (sp = 1, amp = 1) => cat([whisperVowel(150 * sp, 320, 800, amp), noise(50 * sp, 0.03 * amp), whisperVowel(160 * sp, 700, 1200, amp), whisperVowel(220 * sp, 650, 1100, amp), whisperVowel(260 * sp, 600, 1000, 0.9 * amp)]);
const WB = () => cat([whisperVowel(180, 300, 2300, 1), whisperVowel(200, 500, 1800, 1), whisperVowel(160, 350, 2000, 1), whisperVowel(240, 450, 1700, 0.9)]);
const wtpl = [WA(), WA(1.1), WA(0.92), WA(1.05), WA()].map(x => V.template(cat([sil(80), x, sil(80)])));
const wcal = V.calibrate(wtpl, []);
function wmatches(audio) { const s = new V.Segmenter({ sens: 12, gap: 350, voiced: false }), m = new V.Matcher(wtpl, wcal.thr * 1.05); let n = 0; for (const fr of V.frames(audio)) { s.push(fr); if (m.push(fr, s.speech)) n++; } return n; }
// counted as the app counts in rhythm mode: normal mode also needs a quarter of the stretch to be pitched
function wsegs(audio, voiced) { const s = new V.Segmenter({ sens: 17, gap: 350, voiced }); let n = 0; for (const fr of V.frames(audio)) { const r = s.push(fr); if (r && !r.rejected && r.dur >= 250 && (!voiced || r.voicedMs >= r.dur * 0.25)) n++; } return n; }
tests.push(
  ['Whisper: normal mode ignores whispers (pitch required)', () => wsegs(rep(() => WA(), 5, 450), true), 0],
  ['Whisper: whisper mode finds 5 whispers', () => wsegs(rep(() => WA(), 5, 450), false), 5],
  ['Whisper: 10 whispers match your whispered recordings', () => wmatches(rep(() => WA(0.9 + rnd() * 0.25), 10, 450)), 10],
  ['Whisper: quiet whispers (-10 dB)', () => wmatches(rep(() => WA(1, 0.32), 5, 450)), 5],
  ['Whisper: a different whispered dhikr', () => wmatches(rep(WB, 5, 450)), 0],
  ['Whisper: hiss bursts', () => wmatches(cat([sil(500), noise(400, 0.05), sil(600), noise(600, 0.04), sil(600), noise(300, 0.06), sil(1000)])), 0],
  ['Whisper: other people talking (voiced)', () => wmatches(cat([sil(500), tv, sil(400), tv, sil(1000)])), 0],
);
// Rhythm counting as the app does it (Voice.rhythmParams + the same checks and length learning), for a dhikr
// of L Arabic letters. Default settings: 0.35 s pause, 1.6 s for long duas.
function rhythmCount(audio, L) {
  const st = { T: 0, n: 0 }, par = () => V.rhythmParams(L, { gap: 350, longGap: 1600, T: st.T, n: st.n });
  let p = par(); const s = new V.Segmenter({ sens: 17, gap: p.gap, maxMs: p.maxMs }); let n = 0;
  for (const fr of V.frames(audio)) {
    const r = s.push(fr); if (!r || r.rejected) continue;
    if (r.dur < p.lo || r.voicedMs < r.dur * 0.25) continue;
    if (r.dur > p.hi) { if (p.long && st.T && st.n >= 2) n += Math.min(5, Math.round(r.dur / st.T)); continue; }
    n++; st.T = st.T ? st.T * 0.8 + r.dur * 0.2 : r.dur; st.n++;
    if (p.long) { p = par(); s.o.gap = p.gap; s.o.maxMs = p.maxMs; }
  }
  return n;
}
// a long dua (about 300 letters, like the 3 Quls): 4 verses of about 2.4 s with breaths between them
const verse = () => cat([A(1.6), A(1.4)]);
const longDua = (b = 600) => cat([verse(), sil(b), verse(), sil(b * 0.9), verse(), sil(b * 1.1), verse()]);
// a medium dhikr (about 60 letters, like SubhanAllahi wa bihamdihi ‘adada khalqihi): one breath inside
const medium = () => cat([A(1.3), sil(300), A(1.2)]);
tests.push(
  ['Long dua: 3 recitations with breaths between verses', () => rhythmCount(cat([sil(500), longDua(), sil(2000), longDua(), sil(2000), longDua(), sil(2500)]), 300), 3],
  ['Long dua: longer breaths (1 s) between verses', () => rhythmCount(cat([sil(500), longDua(1000), sil(2200), longDua(1000), sil(2500)]), 300), 2],
  ['Long dua: a single verse alone doesn’t count', () => rhythmCount(cat([sil(500), verse(), sil(2500)]), 300), 0],
  ['Long dua: 2 with clear pauses, then 2 with only 1 s between', () => rhythmCount(cat([sil(500), longDua(), sil(2200), longDua(), sil(2200), longDua(), sil(1000), longDua(), sil(2500)]), 300), 4],
  ['Medium dhikr: 3 recitations, 1 s apart', () => rhythmCount(cat([sil(500), medium(), sil(1000), medium(), sil(1000), medium(), sil(2000)]), 60), 3],
  ['Short dhikr: 10 recitations, 0.45 s apart (unchanged)', () => rhythmCount(rep(A, 10, 450), 9), 10],
);
const rows = tests.map(([name, fn, want]) => { const got = fn(); return `<tr><td class="${got === want ? 'p' : 'f'}">${got === want ? 'pass' : 'FAIL'}</td><td>${name}</td><td>got ${got}, want ${want}</td></tr>`; });
const pass = rows.filter(r => r.includes('"p"')).length;
document.getElementById('out').innerHTML = `<tr><td colspan=3><b>${pass}/${tests.length} pass</b> · threshold ${cal.thr.toFixed(2)} (samples ${cal.lo.toFixed(2)}–${cal.hi.toFixed(2)}, closest other ${cal.minNeg.toFixed(2)})</td></tr>` + rows.join('');
window.result = { pass, total: tests.length };
</script>
